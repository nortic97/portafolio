<section class="home d-flex align-items-center" data-aos="fade-up" id="home" itemscope itemtype="https://schema.org/Person">

        <div class="profile-section">

               height="800" width="800" itemprop="image">
        </div>
      </div>

      <div class="col-lg-7" data-aos="fade-left">
        <div class="content-section">
          <p class="greeting">¡Hola! Soy</p>

            <a routerLink="/home" fragment="contact" class="btn btn-outline-primary">

            </a>
            <a href="https://www.linkedin.com/in/nortic/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn">
              <i class="fab fa-linkedin"></i>
            </a>
            <a href="mailto:akiles.n.1@gmail.com" class="social-link" aria-label="Email">
              <i class="fas fa-envelope"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

<section id="about">
